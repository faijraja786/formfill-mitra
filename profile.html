<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile - FormFill Mitra</title>
<link rel="stylesheet" href="professional-ui.css?v=20261124">
<style>.page{max-width:850px;margin:28px auto;padding:0 18px}.profile-card{background:#fff;border:1px solid #dce7f7;border-radius:16px;padding:24px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.field{padding:14px;background:#f5f9ff;border:1px solid #e1ebf8;border-radius:11px}.field small{display:block;color:#64748b;margin-bottom:5px}.field strong{overflow-wrap:anywhere}@media(max-width:600px){.profile-grid{grid-template-columns:1fr}}</style>
<script src="app-shell.js" defer></script>
</head>
<body>
<header style="padding:16px 22px"><strong>FormFill <span style="color:#1769e8">Mitra</span></strong><span>Personal · My Profile</span></header>
<main class="page">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px"><div><h1>My Profile</h1><p class="muted">Your applicant information saved with FormFill Mitra.</p></div><button class="btn" type="button" onclick="history.length>1?history.back():location.href='personal-dashboard.html'">← Back</button></div>
 <section class="profile-card">
  <form id="profileForm" class="profile-grid">
    <label class="field"><small>Account name</small><input id="name" maxlength="120" autocomplete="name"></label>
    <label class="field"><small>Email address</small><input id="email" type="email" readonly></label>
    <label class="field"><small>Mobile number</small><input id="phone" type="tel" maxlength="30" autocomplete="tel"></label>
    <label class="field"><small>Date of birth</small><input id="dateOfBirth" type="date" autocomplete="bday"></label>
    <label class="field"><small>Education</small><input id="education" maxlength="300"></label>
    <label class="field"><small>Address</small><textarea id="address" maxlength="1000" rows="3" autocomplete="street-address"></textarea></label>
    <div style="grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn primary" id="saveProfile" type="submit">Save Profile</button>
      <span id="profileMessage" class="muted" role="status"></span>
    </div>
  </form>
</section>
</main>
<script type="module">
import {apiRequest} from "./api-client.js";
const $=id=>document.getElementById(id);
const fields=["name","phone","dateOfBirth","education","address"];
function message(text,error=false){$("profileMessage").textContent=text;$("profileMessage").style.color=error?"#b42318":"#1769e8";}
async function loadProfile(){
  try{
    const result=await apiRequest("/api/me");
    const profile=result.profile||{};
    $("email").value=profile.email||"";
    for(const key of fields)$(key).value=profile[key]||"";
  }catch(error){message(error.message||"Could not load your profile.",true);}
}
$("profileForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const button=$("saveProfile");button.disabled=true;message("Saving…");
  const body={};for(const key of fields)body[key]=$(key).value.trim();
  try{await apiRequest("/api/me",{method:"PATCH",body:JSON.stringify(body)});message("Profile saved successfully.");}
  catch(error){message(error.message||"Could not save your profile.",true);}
  finally{button.disabled=false;}
});
loadProfile();
</script>
</body></html>
