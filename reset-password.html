<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - FormFill Mitra</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.box{max-width:430px;margin:70px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0001}h1{color:#0d47a1}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:9px}input{border:1px solid #ccd5e2}button{border:0;background:#0d47a1;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:9px}.ok{background:#eaf8ef}.err{background:#fff0f0}</style></head>
<body><div class="box"><h1>Reset Password</h1><p>नया password कम से कम 8 characters का रखें।</p><form id="f"><input id="p" type="password" placeholder="New Password" autocomplete="new-password" required><input id="c" type="password" placeholder="Confirm Password" autocomplete="new-password" required><button>Reset Password</button></form><div id="msg"></div></div>
<script>const token=new URLSearchParams(location.search).get('token')||'';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.className='msg';msg.textContent='Updating...';try{const r=await fetch('api/reset-password.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('p').value,confirm_password:document.getElementById('c').value})});const d=await r.json();msg.textContent=d.message||d.error||'Done';if(d.ok){msg.classList.add('ok');setTimeout(()=>location.href='index.html',1500)}else msg.classList.add('err')}catch(x){msg.classList.add('err');msg.textContent='Server connection failed.';}});</script></body></html>
