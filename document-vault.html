<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Vault - FormFill Mitra</title>
<link rel="stylesheet" href="professional-ui.css?v=20261124">
<style>
.page{max-width:1000px;margin:28px auto;padding:0 18px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.muted{color:#64748b}.doc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.doc-card{background:#fff;border:1px solid #dce7f7;border-radius:14px;padding:18px}.doc-card h3{margin:8px 0}.doc-card a{display:inline-block;margin-top:12px;font-weight:700}.empty{padding:32px;text-align:center;background:#fff;border:1px dashed #b8cce8;border-radius:14px}
</style>
<script src="app-shell.js" defer></script>
</head>
<body>
<header style="padding:16px 22px"><strong>FormFill <span style="color:#1769e8">Mitra</span></strong><span>Personal · Document Vault</span></header>
<main class="page">
 <div class="page-head"><div><h1>Document Vault</h1><p class="muted">Documents saved with your applications appear here.</p></div><button class="btn" type="button" onclick="goBack()">← Back to Dashboard</button></div>
 <div id="docList" class="doc-list"><div class="empty">Loading your saved documents…</div></div>
</main>
<script type="module">
import { auth } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { apiRequest } from "./api-client.js";
const box=document.getElementById("docList");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function download(applicationId,documentId,fileName){
 const user=auth.currentUser;if(!user)throw new Error("Please sign in again.");
 const token=await user.getIdToken();
 const response=await fetch("https://form-fill-mitra-api.onrender.com/api/applications/"+encodeURIComponent(applicationId)+"/documents/"+encodeURIComponent(documentId)+"/download",{headers:{Authorization:"Bearer "+token}});
 if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||"Document download failed.");}
 const url=URL.createObjectURL(await response.blob());const a=document.createElement("a");a.href=url;a.download=fileName||"document";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
async function loadServerDocuments(){
 try{
  const user=await new Promise(resolve=>{let stop=()=>{};stop=onAuthStateChanged(auth,value=>{stop();resolve(value);});});
  if(!user){location.replace("personal-login.html");return;}
  const result=await apiRequest("/api/applications");
  const applications=result.applications||[];
  const groups=await Promise.all(applications.map(async app=>{
   const response=await apiRequest("/api/applications/"+encodeURIComponent(app.id)+"/documents");
   return (response.documents||[]).map(doc=>({...doc,applicationId:app.id,formName:app.formName}));
  }));
  const docs=groups.flat();
  if(!docs.length){box.innerHTML='<div class="empty">No securely stored documents yet. Documents uploaded with completed application reviews will appear here.</div>';return;}
  box.innerHTML=docs.map(doc=>'<article class="doc-card"><div>📄</div><h3>'+esc(doc.name||"Applicant document")+'</h3><p class="muted">'+esc(doc.formName||"Application")+' · '+esc(doc.documentKey||"Document")+'</p><p class="muted">'+Math.max(1,Math.round((doc.size||0)/1024))+' KB · '+esc(doc.createdAt||"")+'</p><button class="btn" type="button" data-app="'+esc(doc.applicationId)+'" data-doc="'+esc(doc.id)+'" data-name="'+esc(doc.name)+'">Download securely</button></article>').join("");
  box.querySelectorAll("[data-doc]").forEach(button=>button.addEventListener("click",async()=>{
   button.disabled=true;try{await download(button.dataset.app,button.dataset.doc,button.dataset.name);}catch(error){alert(error.message);}finally{button.disabled=false;}
  }));
 }catch(error){console.error(error);box.innerHTML='<div class="empty">Could not load secure documents: '+esc(error.message)+'</div>';}
}
loadServerDocuments();
</script>
</body></html>
