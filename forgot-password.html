<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password - FormFill Mitra</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.box{max-width:430px;margin:70px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0001}h1{color:#0d47a1}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:9px}input{border:1px solid #ccd5e2}button{border:0;background:#0d47a1;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#eef5ff}.back{display:block;text-align:center;margin-top:18px;color:#0d47a1;text-decoration:none}</style></head>
<body><div class="box"><h1>Forgot Password</h1><p>अपना registered email या username डालें।</p><form id="f"><input id="login" placeholder="Email or Username" autocomplete="username" required><button>Send Reset Link</button></form><div id="msg"></div><a class="back" href="index.html">← Back to Home</a></div>
<script>const API='api/forgot-password.php';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Sending...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login').value.trim()})});const d=await r.json();msg.textContent=d.message||d.error||'Request completed.';}catch(x){msg.textContent='Server connection failed.';}});</script></body></html>
