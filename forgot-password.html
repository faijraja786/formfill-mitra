<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | FormFill Mitra</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
.box{width:100%;max-width:430px;background:#fff;padding:30px;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 35px #0000000d}
h1{margin-top:0}.muted{color:#667085;line-height:1.6}input,button{width:100%;padding:13px;margin-top:12px;border-radius:9px;font-size:15px}input{border:1px solid #d0d5dd}button{border:0;background:#315efb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:14px}.back{display:block;text-align:center;margin-top:18px;color:#315efb;text-decoration:none}
</style><link rel="stylesheet" href="professional-ui.css?v=20261126-design2">
</head><body><main class="box"><h1>Forgot Password?</h1><p class="muted">Enter the email address linked to your account. Firebase will send you a secure password reset link.</p>
<form id="resetForm"><input id="email" type="email" placeholder="Registered email address" autocomplete="email" required><button id="sendBtn" type="submit">Send Reset Link</button></form>
<div id="msg" class="msg" role="status" aria-live="polite"></div><a class="back" href="index.html">← Back to Home</a></main>
<script type="module">
import { auth } from "./firebase-init.js";
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const form=document.getElementById("resetForm"),msg=document.getElementById("msg"),btn=document.getElementById("sendBtn");
form.addEventListener("submit",async event=>{event.preventDefault();btn.disabled=true;btn.textContent="Sending...";msg.style.display="block";try{await sendPasswordResetEmail(auth,document.getElementById("email").value.trim());msg.textContent="If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder."; }catch(error){msg.textContent=error.code==="auth/invalid-email"?"Please enter a valid email address.":"Unable to send the reset email right now. Please try again."; }finally{btn.disabled=false;btn.textContent="Send Reset Link";}});
</script></body></html>
