<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormFill Mitra - Admin Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:800;
    color:#2563eb;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:28px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:600;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.error{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#fee2e2;
    color:#b91c1c;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#2563eb;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">FormFill Mitra</div>
    <div class="subtitle">Admin Control Panel</div>

    <form id="adminLoginForm">

        <label>Admin Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter admin username"
            required
        >

        <label>Admin Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">Login as Admin</button>

        <div class="error" id="errorMessage">
            Invalid admin username or password.
        </div>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script>

document.getElementById("adminLoginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    /*
      TEMPORARY DEVELOPMENT LOGIN

      Production version में username/password
      backend database से verify होंगे.
    */

    if(username === "admin" && password === "admin123"){

        localStorage.setItem("ffm_admin_logged_in", "true");
        localStorage.setItem("ffm_admin_user", username);

        window.location.href = "admin-panel.html";

    }else{

        document.getElementById("errorMessage").style.display = "block";

    }

});

</script>

</body>
</html>
