<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | FormFill Mitra</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#edf4ff,#f8fbff);color:#17345f}
.login-card{width:min(100%,430px);background:#fff;border:1px solid #dce7f7;border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(22,78,150,.12)}
.brand{text-align:center;font-size:27px;font-weight:800;color:#1769e8}.brand span{color:#17345f}.subtitle{text-align:center;color:#64748b;margin:9px 0 25px}
label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd8eb;border-radius:10px;font-size:15px;outline:none}.password-wrap{position:relative}.password-wrap input{padding-right:54px}.toggle-password{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:38px;margin:0;padding:0;background:#edf4ff;color:#1769e8;border-radius:8px;font-size:18px}.helper-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:13px}.helper-links a{color:#1769e8;text-decoration:none;font-weight:650}input:focus{border-color:#1769e8;box-shadow:0 0 0 3px #1769e81c}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#1769e8;color:#fff;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#fff2f0;color:#a12b20;font-size:13px;line-height:1.5}.hint{margin-top:18px;padding:12px;background:#edf4ff;border-radius:10px;color:#526783;font-size:12px;line-height:1.5}.back{display:block;text-align:center;margin-top:20px;color:#1769e8;text-decoration:none;font-weight:650}
</style>
</head>
<body>
<main class="login-card">
<div class="brand">FormFill <span>Mitra</span></div>
<p class="subtitle">Secure administrator sign in</p>
<form id="adminLoginForm">
<label for="email">Admin email</label>
<input id="email" type="email" autocomplete="username" placeholder="Enter authorized admin email" required>
<label for="password">Password</label>
<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="toggle-password" id="togglePassword" type="button" aria-label="Show password" title="Show password">◉</button></div>
<div class="helper-links"><a href="forgot-password.html">Forgot password?</a><a href="personal-signup.html">Create account</a></div>
<button id="loginButton" type="submit">Sign in securely</button>
<div class="message" id="message" role="alert"></div>
</form>
<div class="hint">Admin access is restricted to accounts that have been assigned the administrator permission by the project owner. A normal Personal or Professional account cannot access this panel.</div>
<a class="back" href="index.html">← Back to home</a>
</main>
<script type="module">
import { auth } from "./firebase-init.js";
import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const form=document.getElementById("adminLoginForm");
const button=document.getElementById("loginButton");
const message=document.getElementById("message");
document.getElementById("togglePassword").addEventListener("click",()=>{const input=document.getElementById("password");const showing=input.type==="password";input.type=showing?"text":"password";document.getElementById("togglePassword").textContent=showing?"◉̸":"◉";document.getElementById("togglePassword").setAttribute("aria-label",showing?"Hide password":"Show password");document.getElementById("togglePassword").title=showing?"Hide password":"Show password";});
function showMessage(text){message.textContent=text;message.style.display="block";}
form.addEventListener("submit",async(event)=>{
 event.preventDefault();message.style.display="none";button.disabled=true;button.textContent="Checking access…";
 try{
  const credential=await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);
  if(!credential.user.emailVerified){await signOut(auth);showMessage("Please verify your email address before using Admin Login.");return;}
  if((credential.user.email||"").trim().toLowerCase()!=="faijraja28@gmail.com"){
   await signOut(auth);
   showMessage("This email is not authorized for Admin access.");
   return;
  }
  localStorage.setItem("isLoggedIn","true");
  localStorage.setItem("loginType","admin");
  localStorage.setItem("ffm_admin_user",credential.user.email);
  window.location.replace("admin-panel.html");
 }catch(error){
  const messages={"auth/invalid-credential":"Email or password is incorrect.","auth/too-many-requests":"Too many attempts. Please wait and try again.","auth/network-request-failed":"Network error. Check your internet connection.","auth/invalid-email":"Enter a valid email address.","auth/user-disabled":"This account has been disabled. Contact the project owner.","auth/operation-not-allowed":"Email and password sign-in is not enabled in Firebase Authentication. Enable the Email/Password provider.","auth/user-not-found":"No account found for this email. Create an account first.","auth/wrong-password":"Incorrect password. Use Forgot password to set or reset it."};
  showMessage(messages[error.code]||"Sign in failed. Please check your details and try again.");
 }finally{button.disabled=false;button.textContent="Sign in securely";}
});
</script>
</body>
</html>
