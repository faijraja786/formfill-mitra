<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications - FormFill Mitra</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:#0d47a1;
    color:#fff;
    padding:16px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:21px;
}

.header small{
    opacity:.85;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.top-card,
.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.top-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

h2{
    color:#0d47a1;
    margin:0 0 8px;
    font-size:20px;
}

.subtitle{
    color:#667085;
    font-size:14px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ccd4df;
    border-radius:8px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
}

.search:focus{
    border-color:#0d47a1;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.filter{
    border:1px solid #d5dce5;
    background:#fff;
    color:#444;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
}

.filter.active{
    background:#0d47a1;
    color:#fff;
    border-color:#0d47a1;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border-radius:12px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.stat-number{
    font-size:24px;
    font-weight:bold;
    color:#0d47a1;
}

.stat-label{
    font-size:12px;
    color:#667085;
    margin-top:5px;
}

.application{
    border:1px solid #e0e5eb;
    border-radius:12px;
    padding:17px;
    margin-bottom:12px;
    background:#fff;
}

.application.current{
    border:2px solid #0d47a1;
    background:#f8fbff;
}

.app-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.app-name{
    font-size:17px;
    font-weight:bold;
    color:#0d47a1;
}

.meta{
    color:#667085;
    font-size:12px;
    margin-top:7px;
    line-height:1.6;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.status-draft{
    background:#fff8e1;
    color:#8d6e00;
}

.status-processing{
    background:#e3f2fd;
    color:#1565c0;
}

.status-review{
    background:#ede7f6;
    color:#5e35b1;
}

.status-completed{
    background:#e8f5e9;
    color:#2e7d32;
}

.status-error{
    background:#ffebee;
    color:#c62828;
}

.app-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#0d47a1;
    color:#fff;
}

.btn-secondary{
    background:#e8eef7;
    color:#0d47a1;
}

.btn-danger{
    background:#ffebee;
    color:#c62828;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#777;
}

.empty button{
    margin-top:15px;
}

@media(max-width:850px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){
    .top-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .app-head{
        flex-direction:column;
    }

    .app-actions button{
        flex:1;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div>
            <h1>FormFill Mitra</h1>
            <small>Application Management</small>
        </div>

        <div id="modeText">
            My Applications
        </div>
    </div>
</header>


<div class="container">

    <div class="top-card">

        <div>
            <h2>My Applications</h2>

            <div class="subtitle">
                अपनी सभी applications की progress यहाँ देखें।
            </div>
        </div>

        <button
            class="btn-secondary"
            onclick="goBack()">

            ← Dashboard

        </button>

    </div>


    <!-- Stats -->

    <div class="stats">

        <div class="stat">
            <div
                class="stat-number"
                id="totalCount">
                0
            </div>

            <div class="stat-label">
                Total
            </div>
        </div>

        <div class="stat">
            <div
                class="stat-number"
                id="draftCount">
                0
            </div>

            <div class="stat-label">
                Draft
            </div>
        </div>

        <div class="stat">
            <div
                class="stat-number"
                id="processingCount">
                0
            </div>

            <div class="stat-label">
                Processing
            </div>
        </div>

        <div class="stat">
            <div
                class="stat-number"
                id="reviewCount">
                0
            </div>

            <div class="stat-label">
                Review
            </div>
        </div>

        <div class="stat">
            <div
                class="stat-number"
                id="completedCount">
                0
            </div>

            <div class="stat-label">
                Completed
            </div>
        </div>

    </div>


    <!-- Search -->

    <div class="card">

        <input
            type="search"
            id="searchBox"
            class="search"
            placeholder="Search application or form name..."
            oninput="renderApplications()"
        >

        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
                onclick="setFilter('all',this)">
                All
            </button>

            <button
                class="filter"
                data-filter="draft"
                onclick="setFilter('draft',this)">
                Draft
            </button>

            <button
                class="filter"
                data-filter="processing"
                onclick="setFilter('processing',this)">
                Processing
            </button>

            <button
                class="filter"
                data-filter="review"
                onclick="setFilter('review',this)">
                Review
            </button>

            <button
                class="filter"
                data-filter="completed"
                onclick="setFilter('completed',this)">
                Completed
            </button>

            <button
                class="filter"
                data-filter="error"
                onclick="setFilter('error',this)">
                Error
            </button>

        </div>

    </div>


    <!-- Applications -->

    <div class="card">

        <div id="applicationList">
            <div class="empty">
                Loading applications...
            </div>
        </div>

    </div>

</div>


<script>

/* =========================================================
   MY APPLICATIONS
========================================================= */

let applications = [];
let activeFilter = "all";


/* ---------------------------------------------------------
   JSON
--------------------------------------------------------- */

function getJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        if(!value){
            return fallback;
        }

        return JSON.parse(value);

    }catch(error){

        console.error(error);

        return fallback;
    }
}


/* ---------------------------------------------------------
   Escape
--------------------------------------------------------- */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ---------------------------------------------------------
   Load applications
--------------------------------------------------------- */

function loadApplications(){

    applications =
        getJSON(
            "ffm_applications",
            []
        );

    if(!Array.isArray(applications)){
        applications = [];
    }

    updateStats();

    renderApplications();
}


/* ---------------------------------------------------------
   Normalize status
--------------------------------------------------------- */

function normalizeStatus(status){

    const value =
        String(status || "draft")
        .toLowerCase()
        .trim();

    const allowed = [
        "draft",
        "processing",
        "review",
        "completed",
        "error"
    ];

    return allowed.includes(value)
        ? value
        : "draft";
}


/* ---------------------------------------------------------
   Status label
--------------------------------------------------------- */

function statusLabel(status){

    const labels = {
        draft:"Draft",
        processing:"Processing",
        review:"Review",
        completed:"Completed",
        error:"Error"
    };

    return labels[status] || "Draft";
}


/* ---------------------------------------------------------
   Update stats
--------------------------------------------------------- */

function updateStats(){

    const count = status =>
        applications.filter(
            app =>
                normalizeStatus(app.status) === status
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        applications.length;


    document.getElementById(
        "draftCount"
    ).textContent =
        count("draft");


    document.getElementById(
        "processingCount"
    ).textContent =
        count("processing");


    document.getElementById(
        "reviewCount"
    ).textContent =
        count("review");


    document.getElementById(
        "completedCount"
    ).textContent =
        count("completed");
}


/* ---------------------------------------------------------
   Set filter
--------------------------------------------------------- */

function setFilter(filter,button){

    activeFilter =
        filter;


    document
        .querySelectorAll(".filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");

    renderApplications();
}


/* ---------------------------------------------------------
   Search
--------------------------------------------------------- */

function matchesSearch(app){

    const search =
        document.getElementById(
            "searchBox"
        ).value
        .toLowerCase()
        .trim();


    if(!search){
        return true;
    }


    const text =
        [
            app.formName,
            app.name,
            app.category,
            app.id,
            app.status
        ]
        .join(" ")
        .toLowerCase();


    return text.includes(search);
}


/* ---------------------------------------------------------
   Render
--------------------------------------------------------- */

function renderApplications(){

    const container =
        document.getElementById(
            "applicationList"
        );


    const currentId =
        localStorage.getItem(
            "currentApplicationId"
        );


    const filtered =
        applications.filter(app => {

            const status =
                normalizeStatus(
                    app.status
                );


            const filterMatch =
                activeFilter === "all" ||
                status === activeFilter;


            return filterMatch &&
                   matchesSearch(app);
        });


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                <strong>
                    No applications found.
                </strong>

                <br>

                Start a new application from
                Browse Forms.

                <br>

                <button
                    class="btn-primary"
                    onclick="browseForms()">

                    Browse Forms

                </button>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered
        .map(app => {

            const status =
                normalizeStatus(
                    app.status
                );


            const isCurrent =
                String(app.id) ===
                String(currentId);


            const formName =
                app.formName ||
                app.name ||
                "Unnamed Application";


            const category =
                app.category ||
                "General";


            const created =
                app.createdAt ||
                "Unknown";


            const updated =
                app.updatedAt ||
                created;


            return `

                <div class="
                    application
                    ${isCurrent ? "current" : ""}
                ">

                    <div class="app-head">

                        <div>

                            <div class="app-name">

                                ${escapeHTML(formName)}

                            </div>

                            <div class="meta">

                                Category:
                                ${escapeHTML(category)}

                                <br>

                                Application ID:
                                ${escapeHTML(app.id)}

                                <br>

                                Created:
                                ${escapeHTML(created)}

                                <br>

                                Updated:
                                ${escapeHTML(updated)}

                            </div>

                        </div>


                        <div>

                            <span class="
                                status
                                status-${status}
                            ">

                                ${statusLabel(status)}

                            </span>

                        </div>

                    </div>


                    <div class="app-actions">

                        <button
                            class="btn-primary"
                            onclick="openApplication('${escapeHTML(app.id)}')">

                            Open

                        </button>


                        ${
                            status === "draft"
                            ?

                            `<button
                                class="btn-secondary"
                                onclick="continueApplication('${escapeHTML(app.id)}')">

                                Continue

                            </button>`

                            : ""
                        }


                        ${
                            status === "review"
                            ?

                            `<button
                                class="btn-secondary"
                                onclick="openApplication('${escapeHTML(app.id)}')">

                                Review Again

                            </button>`

                            : ""
                        }


                        ${
                            status === "completed"
                            ?

                            `<button
                                class="btn-secondary"
                                onclick="viewCompleted('${escapeHTML(app.id)}')">

                                View

                            </button>`

                            : ""
                        }


                        <button
                            class="btn-danger"
                            onclick="deleteApplication('${escapeHTML(app.id)}')">

                            Delete

                        </button>

                    </div>

                </div>

            `;

        })
        .join("");
}


/* ---------------------------------------------------------
   Find application
--------------------------------------------------------- */

function findApplication(id){

    return applications.find(
        app =>
            String(app.id) ===
            String(id)
    );
}


/* ---------------------------------------------------------
   Restore application
--------------------------------------------------------- */

function restoreApplication(app){

    if(!app){
        return false;
    }


    /*
       Restore form
    */

    if(app.form){

        localStorage.setItem(
            "selectedForm",
            JSON.stringify(app.form)
        );

    }else{

        /*
           Try admin form list
        */

        const forms =
            getJSON(
                "ffm_admin_forms",
                []
            );


        const form =
            forms.find(
                item =>
                    String(item.id) ===
                    String(app.formId)
            );


        if(form){

            localStorage.setItem(
                "selectedForm",
                JSON.stringify(form)
            );

        }
    }


    localStorage.setItem(
        "formName",
        app.formName || "Application"
    );


    localStorage.setItem(
        "currentApplicationId",
        String(app.id)
    );


    return true;
}


/* ---------------------------------------------------------
   Open application
--------------------------------------------------------- */

function openApplication(id){

    const app =
        findApplication(id);


    if(!app){
        alert("Application not found.");
        return;
    }


    restoreApplication(app);


    /*
       Completed application:
       open final review.
    */

    if(
        normalizeStatus(app.status) ===
        "completed"
    ){

        window.location.href =
            "final-review.html";

        return;
    }


    /*
       Review application
    */

    if(
        normalizeStatus(app.status) ===
        "review"
    ){

        window.location.href =
            "final-review.html";

        return;
    }


    /*
       Otherwise continue from
       form details.
    */

    window.location.href =
        "form-details.html";
}


/* ---------------------------------------------------------
   Continue
--------------------------------------------------------- */

function continueApplication(id){

    const app =
        findApplication(id);


    if(!app){
        return;
    }


    restoreApplication(app);


    /*
       Determine where user should continue
    */

    const finalDone =
        localStorage.getItem(
            "finalReviewCompleted"
        ) === "true";


    const fillingDone =
        localStorage.getItem(
            "formFillingCompleted"
        ) === "true";


    const applicantDone =
        localStorage.getItem(
            "applicantVerified"
        ) === "true";


    if(finalDone){

        window.location.href =
            "final-review.html";

        return;
    }


    if(fillingDone){

        window.location.href =
            "final-review.html";

        return;
    }


    if(applicantDone){

        window.location.href =
            "form-filling.html";

        return;
    }


    window.location.href =
        "form-details.html";
}


/* ---------------------------------------------------------
   View completed
--------------------------------------------------------- */

function viewCompleted(id){

    const app =
        findApplication(id);


    if(!app){
        return;
    }


    restoreApplication(app);


    localStorage.setItem(
        "finalReviewCompleted",
        "true"
    );


    window.location.href =
        "final-review.html";
}


/* ---------------------------------------------------------
   Delete
--------------------------------------------------------- */

function deleteApplication(id){

    const app =
        findApplication(id);


    if(!app){
        return;
    }


    const name =
        app.formName ||
        "this application";


    const confirmed =
        confirm(
            `Delete ${name}?`
        );


    if(!confirmed){
        return;
    }


    applications =
        applications.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    localStorage.setItem(
        "ffm_applications",
        JSON.stringify(applications)
    );


    /*
       If deleted application is current,
       clear current ID.
    */

    if(
        String(
            localStorage.getItem(
                "currentApplicationId"
            )
        ) ===
        String(id)
    ){

        localStorage.removeItem(
            "currentApplicationId"
        );

        localStorage.removeItem(
            "selectedForm"
        );
    }


    updateStats();

    renderApplications();
}


/* ---------------------------------------------------------
   Browse Forms
--------------------------------------------------------- */

function browseForms(){

    const type =
        localStorage.getItem(
            "loginType"
        );


    if(type === "professional"){

        window.location.href =
            "professional-dashboard.html";

    }else{

        window.location.href =
            "personal-dashboard.html";
    }
}


/* ---------------------------------------------------------
   Back
--------------------------------------------------------- */

function goBack(){

    const type =
        localStorage.getItem(
            "loginType"
        );


    if(type === "professional"){

        window.location.href =
            "professional-dashboard.html";

    }else{

        window.location.href =
            "personal-dashboard.html";
    }
}


/* ---------------------------------------------------------
   Mode
--------------------------------------------------------- */

function loadMode(){

    const type =
        localStorage.getItem(
            "loginType"
        );


    document.getElementById(
        "modeText"
    ).textContent =
        type === "professional"
        ? "Professional Mode"
        : "Personal Mode";
}


/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadMode();

        loadApplications();

    }
);

</script>

</body>
</html>
