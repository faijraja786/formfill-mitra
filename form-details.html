<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FormFill Mitra - Documents</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

header{
    background:#172554;
    color:white;
    padding:18px 20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h1{
    margin-bottom:10px;
}

.description{
    color:#64748b;
    line-height:1.6;
    margin-bottom:20px;
}

.document{
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:18px;
    margin-top:15px;
    background:#fafafa;
}

.document h3{
    margin-bottom:8px;
}

.document p{
    color:#64748b;
    font-size:13px;
    margin-bottom:10px;
}

input[type="file"]{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:white;
}

.file-info{
    margin-top:8px;
    color:#15803d;
    font-size:13px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:22px;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:13px;
    border-radius:8px;
    margin-bottom:15px;
}

.info{
    background:#eff6ff;
    color:#1e40af;
    padding:13px;
    border-radius:8px;
    margin-top:18px;
    line-height:1.5;
}

@media(max-width:600px){
    .card{
        padding:18px;
    }
}
</style>
<link rel="stylesheet" href="professional-ui.css?v=20261124">
<script src="app-shell.js" defer></script>
</head>

<body>

<header>
    <div class="logo">FormFill Mitra</div>
</header>

<main class="container">

    <section class="card">

        <h1 id="formName">
            Loading Form...
        </h1>

        <div
            id="description"
            class="description">
        </div>

        <div
            id="errorBox"
            class="error">
        </div>

        <div id="documentsContainer"></div>

        <div class="info">
            Upload only documents you are authorized to use. Supported formats: PDF, JPG, PNG and WEBP. Maximum file size: 10 MB each. Review every file before continuing. Confirm the official portal's current requirements before final submission.
        </div>

        <div class="buttons">

            <button
                class="secondary"
                onclick="goBack()">
                ← Back
            </button>

            <button
                class="primary"
                onclick="continueToOCR()">
                Continue to OCR →
            </button>

        </div>

    </section>

</main>

<script>

const DB_NAME = "FormFillMitraDB";
const DB_VERSION = 1;
const STORE_NAME = "documents";


const documentNames = {

    identity:"Identity Document",

    education:"Educational Document",

    photograph:"Photograph",

    signature:"Signature",

    address:"Address Proof",

    caste:"Caste Certificate",
    income_proof:"Income Supporting Document",
    other:"Additional Supporting Document"

};


const selectedForm =
    JSON.parse(
        localStorage.getItem("selectedForm")
    );


/* ==============================
   DATABASE
============================== */

function openDatabase(){

    return new Promise(function(resolve,reject){

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );


        request.onupgradeneeded =
            function(event){

                const db =
                    event.target.result;


                if(!db.objectStoreNames.contains(STORE_NAME)){

                    db.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath:"id"
                        }
                    );

                }

            };


        request.onsuccess =
            function(){

                resolve(request.result);

            };


        request.onerror =
            function(){

                reject(request.error);

            };

    });

}


/* ==============================
   SAVE FILE
============================== */

async function saveDocument(
    documentKey,
    file
){

    const db =
        await openDatabase();


    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const record = {

                id:
                    "current_" +
                    documentKey,

                documentKey:
                    documentKey,

                formId:
                    selectedForm.id ||
                    selectedForm.name,

                file:file,

                name:file.name,

                type:file.type,

                size:file.size,

                savedAt:
                    new Date().toISOString()

            };


            const request =
                store.put(record);


            request.onsuccess =
                function(){

                    resolve();

                };


            request.onerror =
                function(){

                    reject(request.error);

                };

        }
    );

}


/* ==============================
   DELETE OLD FILES
============================== */

async function clearCurrentDocuments(){

    const db =
        await openDatabase();


    return new Promise(
        function(resolve,reject){

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.openCursor();


            request.onsuccess =
                function(event){

                    const cursor =
                        event.target.result;


                    if(cursor){

                        if(
                            String(cursor.key)
                            .startsWith("current_")
                        ){

                            store.delete(
                                cursor.key
                            );

                        }

                        cursor.continue();

                    }else{

                        resolve();

                    }

                };


            request.onerror =
                function(){

                    reject(request.error);

                };

        }
    );

}


/* ==============================
   SHOW FORM
============================== */

function loadForm(){

    if(!selectedForm){

        document.getElementById("formName")
            .textContent =
            "Form Not Selected";

        return;

    }


    document.getElementById("formName")
        .textContent =
        selectedForm.name || "Selected Form";


    document.getElementById("description")
        .textContent =
        selectedForm.description ||
        "Upload the required documents.";


    const container =
        document.getElementById(
            "documentsContainer"
        );


    const configuredDocuments =
        Array.isArray(selectedForm.documents) ? selectedForm.documents : [];
    const documents = configuredDocuments.length
        ? configuredDocuments.map(function(item, index) {
            if (typeof item === "string") return { key: item, label: documentNames[item] || item, required: true };
            return { key: item.key || ("document_" + index), label: item.label || item.key || "Supporting Document", required: Boolean(item.required) };
        })
        : [
            { key: "identity", label: "Identity Document", required: false },
            { key: "photograph", label: "Photograph", required: false },
            { key: "address", label: "Address Proof", required: false },
            { key: "income_proof", label: "Income Supporting Document", required: false },
            { key: "other", label: "Additional Supporting Document", required: false }
          ];

    if (!configuredDocuments.length) {
        container.innerHTML = '<div class="info">No service-specific mandatory checklist has been verified. Upload the documents available to you and confirm the final list on the official portal.</div>';
    }

    container.innerHTML +=
        documents.map(function(document){
            const key = document.key;
            const name = document.label;
            return `

                <div class="document">
                    <h3>${escapeHTML(name)}</h3>
                    <p>${escapeHTML(key)} · ${document.required ? "Required" : "Optional"}</p>
                    <input type="file" id="document_${escapeHTML(key)}" accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf" onchange="showFileInfo('${escapeHTML(key)}')">
                    <div class="file-info" id="info_${escapeHTML(key)}"></div>
                </div>
            `;
        }).join("");

}


/* ==============================
   FILE INFO
============================== */

function showFileInfo(key){

    const input =
        document.getElementById(
            "document_" + key
        );

    const info =
        document.getElementById(
            "info_" + key
        );


    if(!input.files.length){

        info.textContent = "";

        return;

    }


    const file =
        input.files[0];


    const sizeMB =
        file.size /
        (1024 * 1024);


    info.textContent =
        "✓ " +
        file.name +
        " (" +
        sizeMB.toFixed(2) +
        " MB)";

}


/* ==============================
   CONTINUE TO OCR
============================== */

async function continueToOCR(){

    hideError();


    if(!selectedForm){

        showError(
            "Please select a form first."
        );

        return;

    }


    const configuredDocuments =
        Array.isArray(selectedForm.documents) ? selectedForm.documents : [];
    const documents = configuredDocuments.length
        ? configuredDocuments.map(function(item, index) {
            if (typeof item === "string") return { key: item, label: documentNames[item] || item, required: true };
            return { key: item.key || ("document_" + index), label: item.label || item.key || "Supporting Document", required: Boolean(item.required) };
        })
        : [
            { key: "identity", label: "Identity Document", required: false },
            { key: "photograph", label: "Photograph", required: false },
            { key: "address", label: "Address Proof", required: false },
            { key: "income_proof", label: "Income Supporting Document", required: false },
            { key: "other", label: "Additional Supporting Document", required: false }
          ];
    const selectedFiles = {};

    for(const document of documents){
        const key = document.key;
        const actualInput = window.document.getElementById("document_" + key);
        if (!actualInput || !actualInput.files || !actualInput.files.length) {
            if (document.required) {
                showError("Required document missing: " + document.label);
                return;
            }
            continue;
        }


        const file =
            actualInput.files[0];


        /* Basic size protection */

        if(
            file.size >
            10 * 1024 * 1024
        ){

            showError(
                (documentNames[key] || key) +
                " 10 MB is too large."
            );

            return;

        }


        selectedFiles[key] = {

            name:file.name,

            type:file.type,

            size:file.size

        };

    }


    if (!Object.keys(selectedFiles).length) {
        showError("Upload at least one document or photograph before continuing.");
        return;
    }

    try{

        /*
        Remove previous current documents
        */

        await clearCurrentDocuments();


        /*
        Save actual File objects in IndexedDB
        */

        for(const key of Object.keys(selectedFiles)) {
            const input = document.getElementById("document_" + key);
            await saveDocument(key, input.files[0]);
        }


        /*
        Store metadata as well
        */

        localStorage.setItem(
            "uploadedDocuments",
            JSON.stringify(
                selectedFiles
            )
        );


        localStorage.setItem(
            "documentsUploaded",
            "true"
        );


        localStorage.setItem(
            "ocrReady",
            "true"
        );


        location.href =
            "ocr-processing.html";


    }catch(error){

        console.error(error);

        showError(
            "The documents could not be saved. Check your browser storage permissions and try again."
        );

    }

}


/* ==============================
   ERROR
============================== */

function showError(message){

    const box =
        document.getElementById(
            "errorBox"
        );

    box.textContent = message;

    box.style.display = "block";

}


function hideError(){

    document.getElementById(
        "errorBox"
    ).style.display = "none";

}


/* ==============================
   BACK
============================== */

function goBack(){

    if(
        localStorage.getItem("loginType")
        === "professional"
    ){

        location.href =
            "professional-dashboard.html";

    }else{

        location.href =
            "personal-dashboard.html";

    }

}


/* ==============================
   ESCAPE
============================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* START */

loadForm();

</script>

</body>
</html>
