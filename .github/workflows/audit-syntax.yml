name: Audit syntax checks

on:
  push:
    branches:
      - audit/ocr-fill-reliability
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend and standalone JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys

          files = [Path("server.js")] + list(Path(".").glob("*.js"))
          failed = False
          for path in sorted(set(files)):
              if not path.exists():
                  continue
              result = subprocess.run(
                  ["node", "--check", "--input-type=module"],
                  input=path.read_text(encoding="utf-8"),
                  text=True, capture_output=True
              )
              if result.returncode:
                  failed = True
                  print(f"FAIL {path}:\n{result.stderr}")
              else:
                  print(f"PASS {path}")
          if failed:
              sys.exit(1)
          PY
      - name: Check backend-backed workflow contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          checks = {
              "staff-management.html": ["apiRequest(\"/api/staff\")", "/api/staff/assign-role", "/api/staff/"],
              "task-management.html": ["apiRequest(\"/api/applications\")", "apiRequest(\"/api/tasks\")", "applicationId", "staffUid"],
              "profile.html": ["apiRequest(\"/api/me\")", "method:\"PATCH\""],
              "activity-monitoring.html": ["apiRequest(\"/api/activity\")", "refreshActivity"],
              "admin-panel.html": ["window.ffmApiRequest = apiRequest", "/api/forms", "/api/admin/subscription-settings"],
              "subscription.html": ["apiRequest(\"/api/subscription-settings\")"],
              "subscription-management.html": ["apiRequest(\"/api/subscription-settings\")", "/api/admin/subscription-settings"],
              "api-client.js": ["onAuthStateChanged(auth", "getIdToken()"],
              "document-vault.html": ["local-vault.js?v=privacy-local-1", "migrateBtn"],
              "local-vault.js": ["indexedDB.open(DB_NAME, 1)", "personal-vault", "migrateServerVault"],
              "form-details.html": ["localDocs(user.uid)", "selectedVaultDocumentIds"],
              "final-review.html": ["localRecord.file instanceof Blob", "selectedLocalDocs"],
              "server.js": ["personalDataExpiresAt", "purgeExpiredApplicationData", "req.body.confirmed !== true", "return fail(res, 410"] ,
              "server.js": ['app.get("/api/tasks"', 'app.post("/api/tasks"', 'app.patch("/api/tasks/:id"', 'app.delete("/api/tasks/:id"']
          }
          failed = False
          for filename, needles in checks.items():
              content = Path(filename).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in content:
                      failed = True
                      print(f"FAIL {filename}: missing {needle}")
              if filename in ("staff-management.html", "task-management.html", "profile.html") and "localStorage" in content:
                  failed = True
                  print(f"FAIL {filename}: legacy browser-only data storage remains")
              if not failed:
                  print(f"PASS {filename}")
          admin = Path("admin-panel.html").read_text(encoding="utf-8")
          if 'localStorage.getItem("ffm_admin_forms")' in admin or 'localStorage.setItem(\n        "ffm_admin_forms"' in admin:
              failed = True
              print("FAIL admin-panel.html: legacy local-only form catalogue remains")
          if 'localStorage.getItem("ffm_subscription_settings")' in admin:
              failed = True
              print("FAIL admin-panel.html: legacy local-only subscription settings remain")
          sub_admin = Path("subscription-management.html").read_text(encoding="utf-8")
          if "localStorage" in sub_admin:
              failed = True
              print("FAIL subscription-management.html: browser-only settings remain")
          if failed:
              sys.exit(1)
          PY
      - name: Check inline JavaScript in all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, sys

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  kind = (attrs.get("type") or "").strip().lower()
                  if "src" not in attrs and (kind in ("", "text/javascript", "application/javascript", "module")):
                      self.current = []
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          failed = False
          count = 0
          for path in sorted(Path(".").glob("*.html")):
              parser = Scripts()
              parser.feed(path.read_text(encoding="utf-8"))
              for index, source in enumerate(parser.scripts, 1):
                  if not source.strip():
                      continue
                  count += 1
                  result = subprocess.run(
                      ["node", "--check", "--input-type=module"],
                      input=source, text=True, capture_output=True
                  )
                  if result.returncode:
                      failed = True
                      print(f"FAIL {path} inline script {index}:\n{result.stderr}")
                  else:
                      print(f"PASS {path} inline script {index}")
          print(f"Checked {count} inline scripts.")
          if failed:
              sys.exit(1)
          PY
