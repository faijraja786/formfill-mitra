<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Login | FormFill Mitra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.08);
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .logo span {
            color: #315efb;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            outline: none;
        }

        input:focus {
            border-color: #315efb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #315efb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #315efb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        FormFill <span>Mitra</span>
    </div>

    <p class="subtitle">Personal Account</p>

    <form onsubmit="login(event)">

        <label>Email / Mobile</label>
        <input
            type="text"
            placeholder="Enter email or mobile"
            required
        >

        <label>Password</label>
        <input
            type="password"
            placeholder="Enter password"
            required
        >
        
        <a href="forgot-password.html"
   style="display:block;text-align:right;margin-top:8px;color:#315efb;text-decoration:none;font-size:14px;">
    Forgot Password?
</a>

        <button type="submit">
            Login
        </button>

    </form>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>
    function login(event) {
        event.preventDefault();

        localStorage.setItem("loginType", "personal");
localStorage.setItem("isLoggedIn", "true");

window.location.href = "personal-dashboard.html";
    }
</script>

</body>
</html>
