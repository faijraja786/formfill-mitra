<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal | FormFill Mitra</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif;display:grid;place-items:center}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 16px 45px rgba(20,40,80,.08)}
.logo{text-align:center;font-size:25px;font-weight:800;margin-bottom:8px}.logo span{color:#315efb}
h1{text-align:center;font-size:23px;margin:22px 0 8px}.sub{text-align:center;color:#667085;margin:0 0 24px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}input:focus{outline:2px solid #dbe5ff;border-color:#315efb}\n.password-wrap{position:relative}.password-wrap input{padding-right:54px}.toggle-password{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:38px;margin:0;padding:0;background:#eef3ff;color:#315efb;border:0;border-radius:8px;font-size:19px;display:grid;place-items:center}.toggle-password:hover{background:#e2eaff}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#315efb;color:white;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.6;cursor:wait}.google{background:#fff;color:#172033;border:1px solid #d0d5dd;margin-top:12px}
.divider{text-align:center;color:#98a2b3;font-size:13px;margin:16px 0}.links{text-align:center;margin-top:20px;color:#667085;font-size:14px}.links a,.forgot{color:#315efb;text-decoration:none}.forgot{display:block;text-align:right;margin-top:10px;font-size:13px}
.message{display:none;margin-top:16px;padding:12px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:13px;line-height:1.5}.message.error{background:#fff1f2;color:#be123c}.back{display:block;text-align:center;margin-top:20px;color:#667085;text-decoration:none;font-size:14px}
</style></head><body><main class="card"><div class="logo">FormFill <span>Mitra</span></div><h1>Welcome back</h1><p class="sub">Personal Account</p>
<form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="Enter your email" required>
<label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle-password" type="button" data-toggle="password" aria-label="Show password" title="Show password">👁</button></div>
<a class="forgot" href="forgot-password.html">Forgot Password?</a><button id="submitBtn" type="submit">Login</button></form>
<div class="divider">OR</div><button class="google" id="googleBtn" type="button">Continue with Google</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="links">New here? <a href="personal-signup.html">Create an account</a></div>
<a class="back" href="index.html">← Back to Home</a></main>
<script type="module">
import { auth } from "./firebase-init.js";

import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const ADMIN_EMAIL = "faijraja28@gmail.com";
// If the admin is already authenticated, never leave them on a user login page.
onAuthStateChanged(auth, (user) => {
  if (!user || (user.email || "").trim().toLowerCase() !== ADMIN_EMAIL || user.emailVerified !== true) return;
  localStorage.setItem("isLoggedIn", "true");
  localStorage.setItem("loginType", "admin");
  localStorage.setItem("ffm_admin_user", user.email);
  window.location.replace("admin-panel.html");
});
\ndocument.querySelectorAll("[data-toggle]").forEach((toggle)=>{toggle.addEventListener("click",()=>{const input=document.getElementById(toggle.dataset.toggle);const reveal=input.type==="password";input.type=reveal?"text":"password";toggle.textContent=reveal?"🙈":"👁";toggle.setAttribute("aria-label",reveal?"Hide password":"Show password");toggle.title=reveal?"Hide password":"Show password";});});\nconst form = document.getElementById("authForm");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  setBusy(true);
  try {
    const credential = await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
    if (!credential.user.emailVerified) {
      showMessage("Please verify your email first. Open the verification link sent to your inbox.", true);
      setBusy(false);
      return;
    }
    await routeAfterLogin(credential.user, "personal");
  } catch (error) { showMessage(authMessage(error), true); }
  finally { setBusy(false); }
});
document.getElementById("googleBtn").addEventListener("click", async () => {
  setBusy(true);
  try {
    const credential = await signInWithPopup(auth, new GoogleAuthProvider());
    await routeAfterLogin(credential.user, "personal");
  } catch (error) { showMessage(authMessage(error), true); }
  finally { setBusy(false); }
});
async function routeAfterLogin(user, mode){
  if(!user.emailVerified){showMessage("Please verify your email first.", true);return;}
  const isAdmin=(user.email||"").trim().toLowerCase()===ADMIN_EMAIL;
  localStorage.setItem("isLoggedIn","true");
  localStorage.setItem("loginType",isAdmin?"admin":mode);
  if(isAdmin) localStorage.setItem("ffm_admin_user", user.email);
  window.location.replace(isAdmin?"admin-panel.html":"personal-dashboard.html");
}
function showMessage(message, isError){const el=document.getElementById("message");el.textContent=message;el.className="message"+(isError?" error":"");el.style.display="block";}
function setBusy(busy){document.getElementById("submitBtn").disabled=busy;document.getElementById("googleBtn").disabled=busy;document.getElementById("submitBtn").textContent=busy?"Please wait...":"Login";}
function authMessage(error){const map={"auth/email-already-in-use":"An account with this email already exists.","auth/invalid-email":"Please enter a valid email address.","auth/weak-password":"Choose a stronger password.","auth/invalid-credential":"Incorrect email or password.","auth/user-not-found":"No account found. Please sign up first.","auth/wrong-password":"Incorrect password.","auth/popup-closed-by-user":"Google sign-in was cancelled.","auth/unauthorized-domain":"This website domain is not authorized in Firebase Authentication."};return map[error.code]||"Something went wrong. Please try again.";}
</script></body></html>
