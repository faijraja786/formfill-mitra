<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FormFill Mitra - Task Management</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

header{
    background:#172554;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.badge{
    background:#334155;
    padding:8px 13px;
    border-radius:20px;
    font-size:13px;
}

.nav{
    background:white;
    padding:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.nav button{
    border:0;
    padding:11px 15px;
    border-radius:8px;
    background:#eef2ff;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h2{
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.btn{
    border:0;
    padding:11px 16px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e5e7eb;
}

.success{
    background:#16a34a;
    color:white;
}

.warning{
    background:#f59e0b;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.task{
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:18px;
    margin-top:12px;
    background:#fafafa;
}

.task h3{
    margin-bottom:8px;
}

.meta{
    color:#64748b;
    font-size:14px;
    line-height:1.7;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    margin:8px 0;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.processing{
    background:#dbeafe;
    color:#1d4ed8;
}

.completed{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:700px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .nav button{
        width:100%;
    }
}
</style>
<link rel="stylesheet" href="professional-ui.css?v=20261124">
<script src="app-shell.js" defer></script>
</head>

<body>

<header>
    <div class="logo">FormFill Mitra</div>
    <div class="badge">Workspace • Task Management</div>
</header>



<main class="container">

    <section class="card">

        <h2>➕ Create Application Task</h2>

        <div class="form-grid">
            <div class="full">
                <label>Select Application *</label>
                <select id="applicationId" required>
                    <option value="">Loading applications…</option>
                </select>
            </div>
            <div class="full">
                <label>Assign Staff *</label>
                <select id="staffSelect" required>
                    <option value="">Loading staff accounts…</option>
                </select>
            </div>
            <div class="full">
                <label>Task Note</label>
                <textarea id="taskNote" maxlength="2000" placeholder="Task instructions…"></textarea>
            </div>
        </div>

            <div>
                <label>Select Form</label>
                <select id="formSelect">
                    <option value="">Select Form</option>
                </select>
            </div>

            <div>
                <label>Assign Staff</label>
                <select id="staffSelect">
                    <option value="">Select Staff</option>
                </select>
            </div>

            <div class="full">
                <label>Task Note</label>
                <textarea
                    id="taskNote"
                    placeholder="Task instructions..."></textarea>
            </div>

        </div>

        <div class="buttons">

            <button
                class="btn primary"
                id="createTaskBtn">
                Create & Assign Task
            </button>

            <button
                class="btn secondary"
                id="clearTaskBtn">
                Clear
            </button>

        </div>

    </section>


    <section class="card">

        <h2>📋 Application Tasks</h2>

        <div id="tasksContainer"></div>

    </section>

</main>

<script type="module">
import {apiRequest} from "./api-client.js";
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let applications=[],staff=[],tasks=[],busy=false;
function goDashboard(){location.href="admin-panel.html";}
function go(page){location.href=page;}
async function loadData(){
  $("tasksContainer").innerHTML='<div class="empty">Loading application tasks…</div>';
  try{
    const [a,s,t]=await Promise.all([apiRequest("/api/applications"),apiRequest("/api/staff"),apiRequest("/api/tasks")]);
    applications=a.applications||[];staff=(s.staff||[]).filter(x=>x.status==="active");tasks=t.tasks||[];
    const appSelect=$("applicationId");
    appSelect.innerHTML='<option value="">Select an application</option>'+applications.map(app=>'<option value="'+esc(app.id)+'">'+esc(app.applicant?.fullName||"Applicant")+' — '+esc(app.formName||"Application")+' ('+esc(app.id)+')</option>').join("");
    const staffSelect=$("staffSelect");
    staffSelect.innerHTML='<option value="">Select an active staff account</option>'+staff.map(person=>{
      const busy=tasks.some(task=>task.staffUid===(person.id||person.uid)&&["Pending","Processing"].includes(task.status));
      return '<option value="'+esc(person.id||person.uid)+'" '+(busy?"disabled":"")+'>'+esc(person.name||person.email||"Staff")+(busy?" — Busy":" — Available")+'</option>';
    }).join("");
    renderTasks();
  }catch(error){
    $("tasksContainer").innerHTML='<div class="empty">'+esc(error.message||"Could not load task data.")+'</div>';
    $("applicationId").innerHTML='<option value="">Could not load applications</option>';
    $("staffSelect").innerHTML='<option value="">Could not load staff</option>';
  }
}
async function createTask(){
  if(busy)return;
  const applicationId=$("applicationId").value,staffUid=$("staffSelect").value,note=$("taskNote").value.trim();
  if(!applicationId){alert("Select a real application.");return;}
  if(!staffUid){alert("Select an available staff account.");return;}
  busy=true;
  try{
    await apiRequest("/api/tasks",{method:"POST",body:JSON.stringify({applicationId,staffUid,note})});
    clearTaskForm();await loadData();alert("Task created and assigned.");
  }catch(error){alert(error.message||"Could not create task.");}
  finally{busy=false;}
}
function clearTaskForm(){$("applicationId").value="";$("staffSelect").value="";$("taskNote").value="";}
function renderTasks(){
  if(!tasks.length){$("tasksContainer").innerHTML='<div class="empty">There are no application tasks yet.</div>';return;}
  $("tasksContainer").innerHTML=tasks.map(task=>{
    const statusClass=({Pending:"pending",Processing:"processing",Completed:"completed",Error:"error"})[task.status]||"pending";
    return '<article class="task"><h3>'+esc(task.applicantName||"Applicant")+'</h3><div class="meta">Application ID: <strong>'+esc(task.applicationId)+'</strong><br>Form: '+esc(task.formName||"Application")+'<br>Assigned Staff: '+esc(task.staffName||task.staffEmail||"—")+'<br>Created: '+esc(task.createdAt||"—")+'</div><span class="status '+statusClass+'">'+esc(task.status)+'</span>'+(task.note?'<p style="margin-top:8px"><strong>Note:</strong> '+esc(task.note)+'</p>':"")+'<div class="buttons">'+(task.status==="Pending"?'<button class="btn primary" data-action="status" data-id="'+esc(task.id)+'" data-status="Processing">Start Processing</button>':"")+(task.status==="Processing"?'<button class="btn success" data-action="status" data-id="'+esc(task.id)+'" data-status="Completed">Complete</button><button class="btn danger" data-action="status" data-id="'+esc(task.id)+'" data-status="Error">Mark Error</button>':"")+'<button class="btn secondary" data-action="delete" data-id="'+esc(task.id)+'">Delete</button></div></article>';
  }).join("");
  $("tasksContainer").querySelectorAll("button[data-action]").forEach(button=>button.addEventListener("click",async()=>{
    if(busy)return;
    const id=button.dataset.id;busy=true;button.disabled=true;
    try{
      if(button.dataset.action==="delete"){
        if(!confirm("Delete this task record?")){button.disabled=false;busy=false;return;}
        await apiRequest("/api/tasks/"+encodeURIComponent(id),{method:"DELETE"});
      }else{
        await apiRequest("/api/tasks/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:button.dataset.status})});
      }
      await loadData();
    }catch(error){alert(error.message||"Could not update task.");button.disabled=false;}
    finally{busy=false;}
  }));
}
$("createTaskBtn").addEventListener("click",createTask);
$("clearTaskBtn").addEventListener("click",clearTaskForm);
window.goDashboard=goDashboard;window.go=go;
loadData();
</script>

</body>
</html>
